flake8 = "7.1.2"
grpcio = "1.71.0"
idna = "3.10"
importlib-metadata = "8.6.1"
iniconfig = "2.0.0"
isort = "6.0.1"
lxml = "5.3.1"
mccabe = "0.7.0"
mypy = "1.15.0"
mypy-extensions = "1.0.0"
numpy = "2.2.3"
openpyxl = "3.1.5"
packaging = "24.2"
pandas-stubs = "2.2.3.250308"
parse = "1.20.2"
pathspec = "0.12.1"
pkginfo = "1.12.1.2"
